<style>
:root{--bg:#F5F6F8;--card:#FFF;--border:#E5E7EB;--navy:#0B2265;--red:#C8102E;--text:#1A1A1A;--mid:#4B5563;--shadow:0 1px 3px rgba(0,0,0,0.06),0 4px 12px rgba(0,0,0,0.04);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',Arial,sans-serif;padding:30px 20px 60px;}
.page{max-width:900px;margin:0 auto;}
.back{display:inline-block;padding:10px 18px;background:var(--navy);color:#fff;text-decoration:none;border-radius:6px;font-weight:600;font-size:14px;margin-bottom:26px;}
header{text-align:center;margin-bottom:30px;}
header h1{font-family:'Oswald',Arial,sans-serif;font-size:clamp(28px,4vw,40px);color:var(--navy);margin:0 0 10px;}
header .accent{width:80px;height:4px;background:var(--red);margin:0 auto 12px;}
header p{color:var(--mid);font-size:15px;margin:0;font-style:italic;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
.team-card{background:var(--card);border-radius:10px;border:1px solid var(--border);box-shadow:var(--shadow);padding:20px;text-align:center;text-decoration:none;color:inherit;transition:transform 0.15s;}
.team-card:hover{transform:translateY(-2px);border-color:var(--red);}
.team-card img{height:64px;margin-bottom:10px;}
.team-card .name{font-family:'Oswald',Arial,sans-serif;font-size:18px;font-weight:600;color:var(--navy);}
.team-card .record{font-size:13px;color:var(--mid);margin-top:4px;}
</style>
</head>
